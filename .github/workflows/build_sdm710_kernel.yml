name: Build RMX1901-Kernel (KSU & Non-KSU)
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TELEGRAM_TO: "${{ secrets.TELEGRAM_TO }}"
      TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "sdm670-perf_defconfig"
      KERNEL_CMDLINE: "ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out LLVM=1 LLVM_IAS=1"
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2
      with:
        submodules: 'true'
        fetch-depth: 0
    
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.16
    
    - name: Install dependencies
      id: version
      run: |
        sudo apt-get update -y 
        sudo apt install gcc-aarch64-linux-gnu -y
        sudo apt install gcc-arm-linux-gnueabi -y
        sudo apt install binutils make python3 libssl-dev build-essential bc bison flex zip unzip libssl-dev ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs -y
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        git clone https://github.com/shravansayz/AnyKernel3 -b master --depth=1 AnyKernel3-KSU
        git clone https://github.com/shravansayz/AnyKernel3 -b master --depth=1 AnyKernel3-NonKSU
        rm -rf AnyKernel3-KSU/.git AnyKernel3-KSU/.github
        rm -rf AnyKernel3-NonKSU/.git AnyKernel3-NonKSU/.github
        git submodule sync
        git submodule update --init --recursive
        cd $GITHUB_WORKSPACE/KernelSU-Next
        git checkout next
        git pull
        export VERSION=$(git rev-list --count HEAD)
        echo "VER=$(($VERSION + 10200))" >> $GITHUB_OUTPUT
        cd -
    
    - name: GetTime
      id: get_time
      run: |
        echo "TIME=$(TZ=UTC-8 date +%m%d%H%M )" >> $GITHUB_OUTPUT
    
    # First build: With KernelSU
    - name: Build Kernel with KernelSU
      run: |
        export PATH=$(pwd)/clang/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Create a KSU branch to keep the KernelSU integration
        git checkout -b with-ksu
        
        # Configure and build with KernelSU
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang"
        make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc --all)
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-KSU/
    
    - name: Upload KernelSU Kernel
      uses: actions/upload-artifact@v4.6.0
      with:
        name: RMX1901-BloodMoon-KernelSU-Next-${{ steps.version.outputs.VER }}-${{ steps.get_time.outputs.TIME }}
        path: "AnyKernel3-KSU/*"
    
    # Clean everything and prepare for non-KSU build
    - name: Prepare for non-KSU build
      run: |
        # Create a fresh branch without KernelSU integration
        git checkout -b wipp $(git rev-parse HEAD~0)
        
        # Create dummy KernelSU functions to satisfy symbol requirements
        mkdir -p drivers/kernelsu
        cat > drivers/kernelsu/ksu.c << 'EOF'
        // Dummy KernelSU functions to satisfy external references
        #include <linux/fs.h>
        
        int ksu_handle_devpts(struct fs_context *fc) { return 0; }
        EOF
        
        # Create a simple Makefile for the dummy functions
        cat > drivers/kernelsu/Makefile << 'EOF'
        obj-y += ksu.o
        EOF
        
        # Update the top-level Makefile to include our dummy directory
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo "obj-y += kernelsu/" >> drivers/Makefile
        fi
        
        # Create Kconfig file
        cat > drivers/kernelsu/Kconfig << 'EOF'
        # Empty Kconfig to satisfy inclusion
        EOF
        
        # Clean build artifacts
        make $KERNEL_CMDLINE clean
        make $KERNEL_CMDLINE mrproper
    
    # Second build: Without KernelSU but with dummy symbols
    - name: Build Kernel without KernelSU
      run: |
        export PATH=$(pwd)/clang/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Configure and build without real KernelSU
        make $KERNEL_CMDLINE $KERNEL_DEFCONFIG CC="ccache clang"
        make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc --all)
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-NonKSU/
    
    - name: Upload Non-KernelSU Kernel
      uses: actions/upload-artifact@v4.6.0
      with:
        name: RMX1901-BloodMoon-NonKSU-${{ steps.version.outputs.VER }}-${{ steps.get_time.outputs.TIME }}
        path: "AnyKernel3-NonKSU/*"
